limit_req_zone $binary_remote_addr zone=kmarket_api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.kartkr.cloud;
    server_tokens off;
    client_max_body_size 11m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        limit_req zone=kmarket_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:15102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 135s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(?:swagger-ui(?:/.*|\.html)|v3/api-docs(?:\.yaml|/.*)?)$ {
        limit_req zone=kmarket_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:15102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}

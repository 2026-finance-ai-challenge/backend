name: kmarket

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  postgres:
    <<: *service-defaults
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: kmarket
      POSTGRES_USER: kmarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmarket -d kmarket"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s

  redis-init:
    image: redis:8.6.2
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown root:root /data && chmod 700 /data && chown redis:redis /data"]
    user: "0:0"
    volumes:
      - redis-data:/data
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # 실제 Redis 프로세스가 아닌 1회성 볼륨 초기화에만 허용한다.
      - CHOWN

  redis:
    <<: *service-defaults
    image: redis:8.6.2
    user: "999:999"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?required}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    depends_on:
      redis-init:
        condition: service_completed_successfully
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    stop_grace_period: 20s

  ai-api:
    <<: *service-defaults
    image: ghcr.io/2026-finance-ai-challenge/ai:${AI_IMAGE_TAG:?required}
    environment:
      KMARKET_AI_ENVIRONMENT: production
      KMARKET_AI_ALLOWED_HOSTS: ${KMARKET_AI_ALLOWED_HOSTS:?required}
      KMARKET_AI_DATABASE_URL: postgresql://kmarket:${DB_PASSWORD:?required}@postgres:5432/kmarket
      KMARKET_AI_SERVICE_TOKEN: ${KMARKET_AI_SERVICE_TOKEN:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?required}
      KMARKET_AI_NEWS_MODEL: ${KMARKET_AI_NEWS_MODEL:-gpt-5-nano}
      KMARKET_AI_NEWS_PROMPT_VERSION: ${KMARKET_AI_NEWS_PROMPT_VERSION:-news-intelligence-v2}
      KMARKET_AI_MODEL_BUNDLE_ROOT: /opt/kmarket-model-runtime
      KMARKET_AI_MODEL_BUNDLE_COMMIT: ${KMARKET_AI_MODEL_BUNDLE_COMMIT:?required}
      KMARKET_AI_TERM_PROMPT_VERSION: ${KMARKET_AI_TERM_PROMPT_VERSION:-financial-term-v1}
      KMARKET_AI_TRANSLATION_MODEL: ${KMARKET_AI_TRANSLATION_MODEL:-gpt-5-nano}
      KMARKET_AI_TITLE_TRANSLATION_PROMPT_VERSION: ${KMARKET_AI_TITLE_TRANSLATION_PROMPT_VERSION:-financial-title-translation-v7}
      KMARKET_AI_NEWS_NARRATIVE_PROMPT_VERSION: ${KMARKET_AI_NEWS_NARRATIVE_PROMPT_VERSION:-news-narrative-v12}
      KMARKET_AI_DISCLOSURE_SECTION_PROMPT_VERSION: ${KMARKET_AI_DISCLOSURE_SECTION_PROMPT_VERSION:-disclosure-section-translation-v7}
      KMARKET_AI_FILING_SUMMARY_PROMPT_VERSION: ${KMARKET_AI_FILING_SUMMARY_PROMPT_VERSION:-filing-summary-v3}
      KMARKET_AI_AGENT_MODEL: ${KMARKET_AI_AGENT_MODEL:-gpt-5-nano}
      KMARKET_AI_AGENT_PROMPT_VERSION: ${KMARKET_AI_AGENT_PROMPT_VERSION:-market-agent-v1}
      KMARKET_AI_TAX_DOCUMENT_MODEL: ${KMARKET_AI_TAX_DOCUMENT_MODEL:-gpt-5-nano}
      KMARKET_AI_TAX_DOCUMENT_PROMPT_VERSION: ${KMARKET_AI_TAX_DOCUMENT_PROMPT_VERSION:-kmarket-tax-ocr-e2e-v1}
      KMARKET_AI_PEER_MODEL: ${KMARKET_AI_PEER_MODEL:-gpt-5-nano}
      KMARKET_AI_PEER_PROMPT_VERSION: ${KMARKET_AI_PEER_PROMPT_VERSION:-global-peer-narrative-v2}
    depends_on:
      postgres:
        condition: service_healthy
      model-cache-init:
        condition: service_completed_successfully
    volumes:
      - ./kmarket-model-runtime:/opt/kmarket-model-runtime:ro
      - model-cache:/home/kmarket/.cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    stop_grace_period: 30s

  model-cache-init:
    image: ghcr.io/2026-finance-ai-challenge/ai:${AI_IMAGE_TAG:?required}
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown root:root /cache && chmod 700 /cache && chown 10001:10001 /cache"]
    user: "0:0"
    volumes:
      - model-cache:/cache
    restart: "no"
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # 실제 RAG 프로세스가 아닌 1회성 캐시 볼륨 초기화에만 허용한다.
      - CHOWN

  rag-worker:
    <<: *service-defaults
    image: ghcr.io/2026-finance-ai-challenge/ai:${AI_IMAGE_TAG:?required}
    command: ["k-market-rag-worker"]
    profiles: ["worker"]
    environment:
      KMARKET_AI_ENVIRONMENT: production
      KMARKET_AI_DATABASE_URL: postgresql://kmarket:${DB_PASSWORD:?required}@postgres:5432/kmarket
    depends_on:
      postgres:
        condition: service_healthy
      model-cache-init:
        condition: service_completed_successfully
      # 초기 덤프 이후 Flyway 마이그레이션이 끝난 뒤 인덱싱을 시작한다.
      backend:
        condition: service_healthy
    volumes:
      - model-cache:/home/kmarket/.cache
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    stop_grace_period: 30s

  backend:
    <<: *service-defaults
    image: ghcr.io/2026-finance-ai-challenge/backend:${BACKEND_IMAGE_TAG:?required}
    environment:
      JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=/app/native-tmp
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kmarket
      SPRING_DATASOURCE_USERNAME: kmarket
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OPENDART_API_KEYS: ${OPENDART_API_KEYS:?required}
      OPENDART_ARCHIVE_ROOT: /app/data/opendart-archives
      KMARKET_AI_BASE_URL: http://ai-api:8000
      KMARKET_AI_SERVICE_TOKEN: ${KMARKET_AI_SERVICE_TOKEN:?required}
      KMARKET_CONTEXT_PEPPER: ${KMARKET_CONTEXT_PEPPER:?required}
      KMARKET_JWT_SECRET_BASE64: ${KMARKET_JWT_SECRET_BASE64:?required}
      KMARKET_JWT_ISSUER: k-market-navigator
      KMARKET_JWT_AUDIENCE: k-market-navigator-api
      KMARKET_CORS_ALLOWED_ORIGINS: ${KMARKET_CORS_ALLOWED_ORIGINS:-https://kartkr.cloud,https://www.kartkr.cloud,http://localhost:5173,http://127.0.0.1:5173}
      KMARKET_TAX_DOCUMENT_ROOT: /app/data/tax-documents
      KMARKET_TAX_DOCUMENT_KEY_BASE64: ${KMARKET_TAX_DOCUMENT_KEY_BASE64:?required}
      KMARKET_NAVER_NEWS_ENABLED: ${KMARKET_NAVER_NEWS_ENABLED:-false}
      KMARKET_NAVER_NEWS_CLIENT_ID: ${KMARKET_NAVER_NEWS_CLIENT_ID:-}
      KMARKET_NAVER_NEWS_CLIENT_SECRET: ${KMARKET_NAVER_NEWS_CLIENT_SECRET:-}
      KMARKET_NAVER_NEWS_DISPLAY: ${KMARKET_NAVER_NEWS_DISPLAY:-50}
      KMARKET_NAVER_NEWS_TARGET_BATCH_SIZE: ${KMARKET_NAVER_NEWS_TARGET_BATCH_SIZE:-8}
      KMARKET_NEWS_COLLECTION_INTERVAL: ${KMARKET_NEWS_COLLECTION_INTERVAL:-2m}
      KMARKET_NEWS_MAX_ARTICLE_AGE: ${KMARKET_NEWS_MAX_ARTICLE_AGE:-36h}
      KMARKET_NAVER_NEWS_QUERIES: ${KMARKET_NAVER_NEWS_QUERIES:-}
      KMARKET_NEWS_MAINTENANCE_ENABLED: ${KMARKET_NEWS_MAINTENANCE_ENABLED:-false}
      KMARKET_NEWS_MAINTENANCE_INITIAL_DELAY: ${KMARKET_NEWS_MAINTENANCE_INITIAL_DELAY:-5s}
      KMARKET_GLOBAL_PEER_DATA_VERSION: ${KMARKET_GLOBAL_PEER_DATA_VERSION:-kmarket-global-peer-2026-09-01-openai-v2}
      KMARKET_TRANSLATION_PROVIDER_FAILURE_COOLDOWN: ${KMARKET_TRANSLATION_PROVIDER_FAILURE_COOLDOWN:-15m}
      KMARKET_KIS_ENABLED: ${KMARKET_KIS_ENABLED:-false}
      KMARKET_KIS_APP_KEY: ${KMARKET_KIS_APP_KEY:-}
      KMARKET_KIS_APP_SECRET: ${KMARKET_KIS_APP_SECRET:-}
      KMARKET_KIS_REALTIME_ENABLED: ${KMARKET_KIS_REALTIME_ENABLED:-true}
      KMARKET_KIS_WEBSOCKET_URL: ${KMARKET_KIS_WEBSOCKET_URL:-ws://ops.koreainvestment.com:21000/tryitout}
      KMARKET_KIS_MAX_REALTIME_STOCKS: ${KMARKET_KIS_MAX_REALTIME_STOCKS:-40}
      KMARKET_MARKET_FOREIGN_FLOW_INTERVAL: ${KMARKET_MARKET_FOREIGN_FLOW_INTERVAL:-1m}
      KMARKET_KRX_ENABLED: ${KMARKET_KRX_ENABLED:-false}
      KMARKET_KRX_MEMBER_ID: ${KMARKET_KRX_MEMBER_ID:-}
      KMARKET_KRX_PASSWORD: ${KMARKET_KRX_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    ports:
      # 운영 외부 접근은 호스트 Nginx를 거치며 Backend 포트는 로컬에만 바인딩한다.
      - "127.0.0.1:15102:8080"
    volumes:
      - ./data/opendart-archives:/app/data/opendart-archives
      - ./data/tax-documents:/app/data/tax-documents
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      # 대용량 초기 덤프의 Flyway 마이그레이션 동안 조기 실패로 판정하지 않는다.
      start_period: 10m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      # Zstd JNI 전용 경로만 실행 가능하게 열고 일반 /tmp는 noexec로 유지한다.
      - /app/native-tmp:size=32m,mode=0700,uid=10001,gid=10001,exec
    cap_drop:
      - ALL
    stop_grace_period: 45s

volumes:
  postgres-data:
  redis-data:
  model-cache:

limit_req_zone $binary_remote_addr zone=kmarket_api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 168.107.61.81;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://168.107.61.81$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 168.107.61.81;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/168.107.61.81/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/168.107.61.81/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000" always;

    location /api/ {
        limit_req zone=kmarket_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:15101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:15101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

limit_req_zone $binary_remote_addr zone=kmarket_api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.kartkr.cloud;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 308 https://api.kartkr.cloud$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name api.kartkr.cloud;
    server_tokens off;
    client_max_body_size 11m;
    if ($host != api.kartkr.cloud) { return 444; }

    ssl_certificate /etc/letsencrypt/live/api.kartkr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kartkr.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/javascript application/json application/vnd.oai.openapi application/yaml text/css text/javascript;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /api/ {
        limit_req zone=kmarket_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:15102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 135s;
        proxy_send_timeout 30s;
    }

    location ~ ^/(?:swagger-ui(?:/.*|\.html)|v3/api-docs(?:\.yaml|/.*)?)$ {
        limit_req zone=kmarket_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:15102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

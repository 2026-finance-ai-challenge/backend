services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: kmarket
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?required}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s

volumes:
  postgres-data:

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: kmarket
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?required}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.6.2
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?required}
      - --appendonly
      - "no"
      - --save
      - ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /data:size=32m,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  ai-api:
    build:
      context: ../AI
      dockerfile: Dockerfile
    environment:
      KMARKET_AI_ENVIRONMENT: ${KMARKET_AI_ENVIRONMENT:-local}
      KMARKET_AI_ALLOWED_HOSTS: '["localhost","127.0.0.1","ai-api"]'
      KMARKET_AI_DATABASE_URL: postgresql://${SPRING_DATASOURCE_USERNAME:?required}:${SPRING_DATASOURCE_PASSWORD:?required}@postgres:5432/kmarket
      KMARKET_AI_SERVICE_TOKEN: ${KMARKET_AI_SERVICE_TOKEN:?required}
      KMARKET_DISCLOSURE_TITLE_TRANSLATION_INTERVAL: ${KMARKET_DISCLOSURE_TITLE_TRANSLATION_INTERVAL:-5s}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KMARKET_AI_NEWS_MODEL: ${KMARKET_AI_NEWS_MODEL:-gpt-5-nano}
      KMARKET_AI_NEWS_PROMPT_VERSION: ${KMARKET_AI_NEWS_PROMPT_VERSION:-news-intelligence-v2}
      KMARKET_AI_MODEL_BUNDLE_ROOT: /opt/kmarket-model-runtime
      KMARKET_AI_MODEL_BUNDLE_COMMIT: ${KMARKET_AI_MODEL_BUNDLE_COMMIT:-ab82ccc51cb096872f9a110a85c027a4158a147f}
      KMARKET_AI_TERM_PROMPT_VERSION: ${KMARKET_AI_TERM_PROMPT_VERSION:-financial-term-v1}
      KMARKET_AI_TRANSLATION_MODEL: ${KMARKET_AI_TRANSLATION_MODEL:-gpt-5-nano}
      KMARKET_AI_TITLE_TRANSLATION_PROMPT_VERSION: ${KMARKET_AI_TITLE_TRANSLATION_PROMPT_VERSION:-financial-title-translation-v2}
      KMARKET_AI_NEWS_NARRATIVE_PROMPT_VERSION: ${KMARKET_AI_NEWS_NARRATIVE_PROMPT_VERSION:-news-narrative-v3}
      KMARKET_AI_DISCLOSURE_SECTION_PROMPT_VERSION: ${KMARKET_AI_DISCLOSURE_SECTION_PROMPT_VERSION:-disclosure-section-translation-v1}
      KMARKET_AI_FILING_SUMMARY_PROMPT_VERSION: ${KMARKET_AI_FILING_SUMMARY_PROMPT_VERSION:-filing-summary-v2}
      KMARKET_AI_AGENT_MODEL: ${KMARKET_AI_AGENT_MODEL:-gpt-5-nano}
      KMARKET_AI_AGENT_PROMPT_VERSION: ${KMARKET_AI_AGENT_PROMPT_VERSION:-market-agent-v1}
      KMARKET_AI_TAX_DOCUMENT_MODEL: ${KMARKET_AI_TAX_DOCUMENT_MODEL:-gpt-5-nano}
      KMARKET_AI_TAX_DOCUMENT_PROMPT_VERSION: ${KMARKET_AI_TAX_DOCUMENT_PROMPT_VERSION:-tax-document-v1}
      KMARKET_AI_PEER_MODEL: ${KMARKET_AI_PEER_MODEL:-gpt-5-nano}
      KMARKET_AI_PEER_PROMPT_VERSION: ${KMARKET_AI_PEER_PROMPT_VERSION:-global-peer-narrative-v2}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - type: bind
        source: ${KMARKET_MODEL_BUNDLE_ROOT:-../kmarket-model-runtime}
        target: /opt/kmarket-model-runtime
        read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  rag-worker:
    build:
      context: ../AI
      dockerfile: Dockerfile
    command: ["k-market-rag-worker"]
    profiles: ["worker"]
    environment:
      KMARKET_AI_ENVIRONMENT: ${KMARKET_AI_ENVIRONMENT:-local}
      KMARKET_AI_DATABASE_URL: postgresql://${SPRING_DATASOURCE_USERNAME:?required}:${SPRING_DATASOURCE_PASSWORD:?required}@postgres:5432/kmarket
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - model-cache:/home/kmarket/.cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kmarket
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
      OPENDART_API_KEYS: ${OPENDART_API_KEYS:-}
      OPENDART_ARCHIVE_ROOT: /app/data/opendart-archives
      KMARKET_AI_BASE_URL: http://ai-api:8000
      KMARKET_AI_SERVICE_TOKEN: ${KMARKET_AI_SERVICE_TOKEN:?required}
      KMARKET_CONTEXT_PEPPER: ${KMARKET_CONTEXT_PEPPER:?required}
      KMARKET_JWT_SECRET_BASE64: ${KMARKET_JWT_SECRET_BASE64:?required}
      KMARKET_JWT_ISSUER: ${KMARKET_JWT_ISSUER:-k-market-navigator}
      KMARKET_JWT_AUDIENCE: ${KMARKET_JWT_AUDIENCE:-k-market-navigator-api}
      KMARKET_NAVER_NEWS_ENABLED: ${KMARKET_NAVER_NEWS_ENABLED:-false}
      KMARKET_NAVER_NEWS_CLIENT_ID: ${KMARKET_NAVER_NEWS_CLIENT_ID:-}
      KMARKET_NAVER_NEWS_CLIENT_SECRET: ${KMARKET_NAVER_NEWS_CLIENT_SECRET:-}
      KMARKET_NAVER_NEWS_TARGET_BATCH_SIZE: ${KMARKET_NAVER_NEWS_TARGET_BATCH_SIZE:-8}
      KMARKET_NEWS_COLLECTION_INTERVAL: ${KMARKET_NEWS_COLLECTION_INTERVAL:-2m}
      KMARKET_NEWS_MAX_ARTICLE_AGE: ${KMARKET_NEWS_MAX_ARTICLE_AGE:-36h}
      KMARKET_NAVER_NEWS_QUERIES: ${KMARKET_NAVER_NEWS_QUERIES:-}
      KMARKET_NEWS_MAINTENANCE_ENABLED: ${KMARKET_NEWS_MAINTENANCE_ENABLED:-false}
      KMARKET_NEWS_MAINTENANCE_INITIAL_DELAY: ${KMARKET_NEWS_MAINTENANCE_INITIAL_DELAY:-5s}
      KMARKET_CHAT_GENERATION_INTERVAL: ${KMARKET_CHAT_GENERATION_INTERVAL:-1s}
      KMARKET_TRANSLATION_GENERATION_INTERVAL: ${KMARKET_TRANSLATION_GENERATION_INTERVAL:-2s}
      KMARKET_TRANSLATION_PROVIDER_FAILURE_COOLDOWN: ${KMARKET_TRANSLATION_PROVIDER_FAILURE_COOLDOWN:-15m}
      KMARKET_TRANSLATION_PER_CLIENT_MINUTE_LIMIT: ${KMARKET_TRANSLATION_PER_CLIENT_MINUTE_LIMIT:-12}
      KMARKET_TRANSLATION_GLOBAL_DAILY_LIMIT: ${KMARKET_TRANSLATION_GLOBAL_DAILY_LIMIT:-5000}
      KMARKET_TAX_DOCUMENT_ROOT: /app/data/tax-documents
      KMARKET_TAX_DOCUMENT_KEY_BASE64: ${KMARKET_TAX_DOCUMENT_KEY_BASE64:?required}
      KMARKET_TAX_VERIFICATION_INTERVAL: ${KMARKET_TAX_VERIFICATION_INTERVAL:-2s}
      KMARKET_GLOBAL_PEER_DATA_VERSION: ${KMARKET_GLOBAL_PEER_DATA_VERSION:-kmarket-global-peer-2026-09-01-openai-v2}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      - ./data/opendart-archives:/app/data/opendart-archives
      - tax-document-data:/app/data/tax-documents
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-15101}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  postgres-data:
  model-cache:
  tax-document-data:
